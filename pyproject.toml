[project]
name = "v6rl"
version = "0.6.0"
description = "Desktop version 6 — HA door, Channel A 2.1–2.17, Channel B BB aux, typed T/R."
requires-python = ">=3.11"
dependencies = [
  "numpy>=1.26",
  "pandas>=2.2",
  "torch>=2.2",
  "gymnasium>=0.29",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
v6rl = "v6rl.__main__:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["v6rl*"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
